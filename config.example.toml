# blesentry example configuration (P1-9).
#
# Copy to config.local.toml and edit, then run:
#   blesentry run --config config.local.toml
# config.local.toml is gitignored — a live config carries site-identifying
# facts (site_id, per-site adapter) that must never reach this public repo.
# Only `site_id` and `[storage] db` are required; every other section
# shows its default value and can be deleted. Any field may instead be
# supplied via environment (BLESENTRY_SITE_ID, BLESENTRY_STORAGE__DB, …),
# which is how secrets are injected without writing them to disk.

# Site identifier stamped on every database row. Keep it opaque — this
# repo is public and site names should not identify a location.
site_id = "example-site"

[storage]
# SQLite database path. Created and migrated on start. Use an absolute
# path for a systemd-managed daemon.
db = "/var/lib/blesentry/blesentry.db"

[scan]
window = 10.0      # scan window length, seconds
pause = 5.0        # pause between windows, seconds
# max_cycles is omitted: a deployed daemon scans until SIGTERM. Set it
# only for bounded test or capture runs.

[scanner]
# Backend selector (ADR-0002). "bleak" = production BLE; "mock" = replay
# a captured corpus. The legal option keys depend on this value.
backend = "bleak"
# Semantic adapter label stamped on advertisements (not passed to BlueZ).
# On macOS dev, set to "macos-corebluetooth".
adapter_id = "bluez-linux"
# BlueZ adapter device (Linux only); omit for the system default.
adapter = "hci0"
# BlueZ passive-scan advertisement-monitor patterns, START:ADTYPE:HEXBYTES.
# Provisional AD-FLAGS set — validated on Pi hardware under #68.
or_patterns = ["0:01:06", "0:01:1a", "0:01:05", "0:01:02", "0:01:04"]

# Example of the replay backend instead of bleak:
# [scanner]
# backend = "mock"
# corpus = "tests/fixtures/corpus.json"

[resolver]
# Fusion-resolver thresholds (P1-7). min_score is the fused-score cutoff
# for joining an advertisement to an existing device; recent_window
# bounds the temporally-local rotation-join memory.
min_score = 0.55
recent_window = 512

[notifier]
# Notifier backend selector (ADR-0002). "none" runs the daemon without
# alerting; "telegram" is the v1 chat platform (ADR-0003).
backend = "none"

# Telegram backend (ADR-0003): long-poll getUpdates, no webhook — works
# behind CGNAT/firewalls with zero inbound surface. Alerts and commands
# flow through one private chat with one authorized operator.
# [notifier]
# backend = "telegram"
# chat_id = 123456789   # the one authorized chat
# user_id = 123456789   # the one authorized user; BOTH must match inbound
# poll_timeout = 30.0   # server-side long-poll hold, seconds
#
# bot_token is a SECRET — never write it here (this repo is public and a
# committed token is burned). Inject it via the environment instead:
#   export BLESENTRY_NOTIFIER__BOT_TOKEN="123456:abc..."
# or place it in config.local.toml (gitignored). See SECURITY.md.
