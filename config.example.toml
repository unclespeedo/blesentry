# blesentry example configuration (P1-9).
#
# Copy to config.local.toml and edit, then run:
#   blesentry run --config config.local.toml
# config.local.toml is gitignored — a live config carries site-identifying
# facts (site_id, per-site adapter) that must never reach this public repo.
# Only `site_id` and `[storage] db` are required; every other section
# shows its default value and can be deleted. Any field may instead be
# supplied via environment (BLESENTRY_SITE_ID, BLESENTRY_STORAGE__DB, …),
# which is how secrets are injected without writing them to disk.

# Site identifier stamped on every database row. Keep it opaque — this
# repo is public and site names should not identify a location.
site_id = "example-site"

[storage]
# SQLite database path. Created and migrated on start. Use an absolute
# path for a systemd-managed daemon.
db = "/var/lib/blesentry/blesentry.db"

[scan]
window = 10.0      # scan window length, seconds
pause = 5.0        # pause between windows, seconds
# max_cycles is omitted: a deployed daemon scans until SIGTERM. Set it
# only for bounded test or capture runs.
# Journal cadence is not a config key: the daemon runs at INFO, logs
# each cycle at DEBUG, emits one INFO liveness line after the first
# cycle, then an INFO rollup every 60 cycles (~15 min at these
# defaults). See docs/tuning.md.

[scanner]
# Backend selector (ADR-0002). "bleak" = production BLE; "mock" = replay
# a captured corpus. The legal option keys depend on this value.
backend = "bleak"
# Semantic adapter label stamped on advertisements (not passed to BlueZ).
# On macOS dev, set to "macos-corebluetooth".
adapter_id = "bluez-linux"
# BlueZ adapter device (Linux only); omit for the system default.
adapter = "hci0"
# BlueZ passive-scan advertisement-monitor patterns, START:ADTYPE:HEXBYTES.
# Provisional AD-FLAGS set — validated on Pi hardware under #68.
or_patterns = ["0:01:06", "0:01:1a", "0:01:05", "0:01:02", "0:01:04"]

# Example of the replay backend instead of bleak:
# [scanner]
# backend = "mock"
# corpus = "tests/fixtures/corpus.json"

[resolver]
# Fusion-resolver thresholds (P1-7, ADR-0005). min_score is the fused-
# score cutoff for joining an advertisement to an existing device.
# Floor: must exceed the company-only weight (0.3). At or below 0.3
# every device that shares only a vendor company id collapses into one
# identity — the rotation cloud becomes one row per vendor. The 0.55
# default also requires name or service-set corroboration on top of a
# matching manufacturer payload (0.5). recent_window bounds the
# temporally-local rotation-join memory.
min_score = 0.55
recent_window = 512

[presence]
# Presence debounce + proximity (P2-1). Counts are in SCAN WINDOWS, not
# seconds — one window is (scan.window + scan.pause) long, so at the
# defaults above three windows is ~45 s. This section is the main lever
# for a device-dense site; see docs/tuning.md for a tuning recipe.
#
# rssi_threshold is the proximity GATE: minimum signal (dBm) for a window
# to count. RSSI is negative and rises toward 0 as a device gets closer,
# so RAISING this admits only nearby devices and is the fastest way to
# quiet a noisy site (e.g. -65 ≈ same room). Must be in [-127, 0).
rssi_threshold = -80
# Consecutive in-range windows before a device is PRESENT (a passer-by
# heard for 1–2 windows never qualifies). Higher = calmer, slower.
appear_windows = 3
# Consecutive missed windows before a PRESENT device is ABSENT.
disappear_windows = 3
# Windows after leaving during which a return is the SAME visit (no
# re-alert). 0 = every return is new; to matter it must exceed
# appear_windows. Raise it to stop a device flapping at the edge of range
# from re-alerting.
cooldown_windows = 0
# Forget an ABSENT device after this many missed windows (bounds memory).
# Omit for the default of 4 × disappear_windows.
# prune_after_windows = 12

[notifier]
# Notifier backend selector (ADR-0002). "none" runs the daemon without
# alerting; "telegram" is the v1 chat platform (ADR-0003).
# Note: `run` always drains the outbox. With "none", any queued alert is
# DISCARDED (its outbox row is marked delivered) — configure a real
# backend to actually deliver.
backend = "none"

# Telegram backend (ADR-0003): long-poll getUpdates, no webhook — works
# behind CGNAT/firewalls with zero inbound surface. Alerts and commands
# flow through one private chat with one authorized operator.
# Bulk-label currently-PRESENT unlabeled devices with /init (30 min
# session, resumable; reply with a name, or /skip /ignore /done).
# `blesentry init --config …` on the host; Ctrl-D pauses. Don't drive
# chat and the CLI prompt at the same time.
# [notifier]
# backend = "telegram"
# chat_id = 123456789   # the one authorized chat
# user_id = 123456789   # the one authorized user; BOTH must match inbound
# poll_timeout = 30.0   # server-side long-poll hold, seconds
#
# bot_token is a SECRET — never write it here (this repo is public and a
# committed token is burned). Inject it via the environment instead:
#   export BLESENTRY_NOTIFIER__BOT_TOKEN="123456:abc..."
# or place it in config.local.toml (gitignored). See SECURITY.md.

[detection]
# Detector backend selector (ADR-0006). "none" (default) emits
# nothing — existing daemons unchanged. "mock" records windows
# for tests / F1. "approach" is the A3 rising-RSSI backend
# (ADR-0007 / docs/approach.md): one "approaching" event per
# address visit, enqueued inside the scan-cycle transaction.
# "inside" is the I3 sustained adjacent-to-Pi backend
# (ADR-0009 / docs/inside.md): one "inside-adjacent" event per
# dwell episode, enqueued inside the scan-cycle transaction.
# "crowd" is the C4 robust-baseline + CUSUM backend
# (ADR-0008 / docs/crowd.md): density anomaly with alert roster.
# Approach W/Δ/peak, inside N/M, and all crowd knobs (MAD floor,
# CUSUM k/h, EWMA span, seasonal/rolling sizes, …) stay frozen in
# code, not here.
backend = "none"

# Example of the approach backend:
# [detection]
# backend = "approach"
#
# Example of the inside backend:
# [detection]
# backend = "inside"
#
# Example of the crowd backend:
# [detection]
# backend = "crowd"
#
# Offline eval (F1) is a CLI, not the daemon: `blesentry replay`
# `--fixture` or `--db` (a copied snapshot, never the live WAL).
# Approach needs advertisements, so use --fixture (walkby.json).
# Inside needs heard maps: use --fixture (inside-dwell.json) or
# --db with a copied observations snapshot. Crowd needs heard
# maps: use --fixture (crowd-busy.json / crowd-spike.json) or
# --db with a copied observations snapshot. See docs/replay.md.

[summary]
# Daily digest (P2-9): devices seen, new devices, presence transitions,
# outbox health. Enqueued to the outbox like everything else, so a WAN
# outage yields a late-but-complete summary via the drain. UTC only —
# the Pi has no tz database in the v1 footprint.
# hour_utc is the hour (0–23) at or after which today's digest may fire.
# A last-sent marker in site_state prevents a second send the same UTC
# day, including across daemon restarts. A multi-day downtime produces
# one catch-up covering [last_sent, now), not one row per missed day.
enabled = true
hour_utc = 12
