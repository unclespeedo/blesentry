[project]
name = "blesentry"
version = "0.1.0"
description = "Local-first BLE presence sentinel for remote sites"
readme = "README.md"
requires-python = ">=3.13"
license = "MPL-2.0"
license-files = ["LICENSE"]
keywords = ["bluetooth", "ble", "presence", "sentinel", "raspberry-pi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "aiosqlite>=0.20",
  "bleak>=3.0.2",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.scripts]
blesentry = "blesentry.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "ty>=0.0.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blesentry"]
artifacts = ["src/blesentry/storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "hardware: requires physical hardware (runs Pi-side via P3-3, not in CI)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 50

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501", "I", "UP", "D", "PGH", "S101", "TID252"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unknown-argument = "ignore"
unused-ignore-comment = "error"
