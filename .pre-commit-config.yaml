# Pre-commit gate: the fast local feedback loop. CI enforces the same
# checks on every PR and on main (.github/workflows/ci.yml) — run this
# before pushing so CI never surprises you.
# Requires uv on PATH (uses the project lockfile, not ad-hoc tool versions).
# In bootstrap mode (no pyproject.toml yet, pre-P0-4) hooks no-op, matching
# the CI workflow's `if: steps.proj.outputs.present == 'true'` guards.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: "bash -c 'if [ -f pyproject.toml ]; then uv run ruff check .; else echo \"bootstrap: skipping ruff check\"; fi'"
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: "bash -c 'if [ -f pyproject.toml ]; then uv run ruff format --check .; else echo \"bootstrap: skipping ruff format\"; fi'"
        language: system
        pass_filenames: false

      - id: ty-check
        name: ty check
        entry: "bash -c 'if [ -f pyproject.toml ]; then uv run ty check; else echo \"bootstrap: skipping ty check\"; fi'"
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest (mock-only, no hardware)
        entry: "bash -c 'if [ -f pyproject.toml ]; then uv run pytest -m \"not hardware\"; else echo \"bootstrap: skipping pytest\"; fi'"
        language: system
        pass_filenames: false

      - id: leak-patterns
        name: leak patterns (AGENTS.md public-repo hygiene)
        entry: scripts/hooks/check-leak-patterns.sh
        language: system
